name: Build LidRun and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v6

      - name: Test
        run: swift test

      - name: Build DMG
        env:
          VERSION: 0.1.${{ github.run_number }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./Scripts/build-free-dmg.sh

      - name: Upload DMG to WebCake
        id: upload
        env:
          VERSION: 0.1.${{ github.run_number }}
        run: |
          url="$(./Scripts/upload-webcake.sh "dist/LidRun-$VERSION-unsigned.dmg")"
          sha="$(shasum -a 256 "dist/LidRun-$VERSION-unsigned.dmg" | cut -d ' ' -f 1)"
          prev_json="$(curl -fsSL https://vuluu2k.github.io/LidRun/download.json || true)"
          PREV_JSON="$prev_json" python3 - "$VERSION" "$url" "$sha" "$GITHUB_SHA" <<'PY'
          import json, os, re, subprocess, sys
          version, url, sha256, commit = sys.argv[1:]

          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True)

          try:
              prev = json.loads(os.environ.get("PREV_JSON") or "{}").get("commit") or ""
          except (ValueError, AttributeError):
              prev = ""
          if prev and git("cat-file", "-e", prev + "^{commit}").returncode == 0:
              log = git("log", "--no-merges", "--pretty=%s", prev + "..HEAD")
          else:
              log = git("log", "--no-merges", "--pretty=%s", "-10")
          notes = []
          for subject in log.stdout.splitlines():
              m = re.match(r"(?:feat|fix)(?:\([^)]*\))?!?:\s*(.+)", subject)
              if m:
                  note = m.group(1)[:1].upper() + m.group(1)[1:]
                  if note not in notes:
                      notes.append(note)
          with open("website/download.json", "w", encoding="utf-8") as f:
              json.dump({"version": version, "url": url, "sha256": sha256,
                         "notes": notes[:8], "commit": commit}, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY
          echo "download_url=$url" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

<!doctype html>
<!-- Source for og.png (1200×630). Not linked from the site; re-screenshot after editing. -->
<html><head><meta charset="utf-8"><title>LidRun Personal OG</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css">
<style>
html,body{width:1200px;height:630px;overflow:hidden;margin:0}
body{position:relative;display:flex;align-items:center;gap:64px;padding:0 90px;background:radial-gradient(circle at 85% 20%,#a248b940,transparent 45%),radial-gradient(circle at 10% 110%,#9f493f40,transparent 50%),var(--bg)}
.og-icon{width:260px;height:260px;flex:none;filter:drop-shadow(0 30px 60px #0009)}
h1{font:800 76px/1.05 Manrope,sans-serif;letter-spacing:-.045em;margin:14px 0 22px}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--purple),#f3859f,var(--orange));-webkit-background-clip:text;color:transparent}
p.tag{font-size:30px;line-height:1.45;color:var(--muted);margin:0 0 30px}
.chips{display:flex;gap:10px}.chips span{padding:8px 14px;border:1px solid var(--line);border-radius:99px;background:var(--panel);font-size:18px;color:#cbbfc5}
</style></head>
<body>
  <img class="og-icon" src="favicon.svg" alt="">
  <div>
    <p class="eyebrow" style="font-size:16px;margin:0">FREE · OPEN SOURCE · macOS</p>
    <h1>LidRun <em>Personal</em></h1>
    <p class="tag">Keep your Mac awake for AI &amp; dev work — even with the lid closed. Free &amp; open source.</p>
    <div class="chips"><span>Claude Code</span><span>Cursor</span><span>Docker</span><span>Ollama</span></div>
  </div>
</body></html>
